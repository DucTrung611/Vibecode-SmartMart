services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartmart
      POSTGRES_PASSWORD: smartmart
      POSTGRES_DB: smartmart
    ports:
      - "5432:5432"
    volumes:
      - smartmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmart -d smartmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartmart-postgres-data:
